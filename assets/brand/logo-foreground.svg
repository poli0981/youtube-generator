<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Android adaptive-icon foreground: glyph only, transparent canvas. The
       launcher masks a 108dp layer down to a ~66dp circle, so the artwork is
       scaled to keep its bounding-box diagonal inside that safe zone. The
       background layer is the flat brand colour in ic_launcher_background.xml. -->
