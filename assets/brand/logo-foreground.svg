    <path d="M176 118c0-17.9 19.4-29.1 34.9-20.1l128.2 74c15.5 9 15.5 31.2 0 40.2l-128.2 74C195.4 295.1 176 283.9 176 266z" fill="#fff"/>
    <rect x="136" y="322" width="240" height="32" rx="16" fill="#fff" fill-opacity=".92"/>
    <rect x="136" y="374" width="160" height="32" rx="16" fill="#fff" fill-opacity=".6"/>
  </g>
</svg>
