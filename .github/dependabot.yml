# Dependabot configuration.
#
# Three ecosystems: npm (the app), cargo (the Tauri shell), and github-actions
# (the workflows). Security updates are on repo-wide by default; the entries
# below add scheduled VERSION updates so the tree does not silently rot between
# advisories, and carry the ignore rules that keep unfixable alerts quiet.
#
# Why the cargo ignores: `rand` and `glib` are transitive dependencies of tauri,
# and their security fixes require semver-major bumps that the dependency
# tree does not allow, so every Dependabot security-update job for them
# fails with `security_update_not_possible` (runs 27387346373, 27387346324):
#
#   rand 0.7.3 (fix: 0.8.6) pinned by
#     tauri -> tauri-utils -> kuchikiki -> selectors -> phf_codegen 0.8
#     -> phf_generator 0.8 (requires rand ^0.7)
#   glib 0.18.5 (fix: 0.20.0) pinned by
#     tauri's gtk-rs 0.18 Linux stack (gtk/gdk/gio 0.18 require glib 0.18)
#
# Remove these ignores once tauri updates kuchikiki / the gtk-rs bindings
# (re-check with: cargo update -p rand@0.7.3 --precise 0.8.6 --dry-run).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR per family instead of one per package. A split React or
      # typescript-eslint bump is never independently mergeable anyway, and
      # CI has to run for each PR.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      i18n:
        patterns: ["i18next*", "react-i18next"]
      tauri:
        patterns: ["@tauri-apps/*"]
      lint-and-format:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier*", "knip"]
      build-tooling:
        patterns: ["vite", "vitest", "@vitejs/*", "tailwindcss", "postcss", "autoprefixer", "tsx"]
    ignore:
      # Majors land in their own planned release (see docs/ROADMAP.md) because
      # each one needs a real migration — React 19, Tailwind 4 and ESLint 10 all
      # change APIs the app uses directly. Dependabot handles minor + patch.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    # No version-update PRs; this entry only feeds ignore rules to security
    # updates. The Rust side is pinned to whatever tauri's tree allows.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "rand"
      - dependency-name: "glib"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
