name: Notify CI Failures

on:
  workflow_run:
    # Match the exact `name:` of the CI workflow (.github/workflows/ci.yml).
    # Renaming CI silently breaks this filter — keep them in sync.
    workflows: ["CI"]
    types: [completed]

# REQUIRED: declare permissions matching the reusable workflow's needs.
# Reusable needs `actions: read` to inspect workflow_run details.
permissions:
  contents: read
  actions: read

jobs:
  notify:
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@main
    secrets: inherit
