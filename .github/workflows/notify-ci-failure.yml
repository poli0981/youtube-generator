name: Notify CI Failures

on:
  workflow_run:
    # Match the exact `name:` of each watched workflow (ci.yml, security.yml,
    # compliance.yml, rust.yml). Renaming one silently breaks this filter —
    # keep them in sync.
    workflows: ["CI", "Security", "Compliance", "Rust"]
    types: [completed]

# REQUIRED: declare permissions matching the reusable workflow's needs.
# Reusable needs `actions: read` to inspect workflow_run details.
permissions:
  contents: read
  actions: read

jobs:
  notify:
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@main
    # Only the webhook the shared workflow declares — not `inherit`.
    secrets:
      DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
