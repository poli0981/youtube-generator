name: Pages migration notice

# The app moved to https://ytgenerator.stream. What used to be the GitHub
# Pages site (poli0981.github.io/youtube-generator) is replaced by a single
# static page that hands visitors the data their browser saved there — as a
# backup file the new site restores — and points them to the new address.
#
# Run by hand once; the page is removed on 2026-11-29 together with this
# workflow and the github-pages environment (tracked in an issue).
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: migration-page
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
