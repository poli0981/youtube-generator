name: Notify Deploy Status

on:
  workflow_run:
    # Match the exact `name:` of the deploy workflow
    # (.github/workflows/deploy-web.yml). Renaming it silently breaks this
    # filter — keep them in sync.
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    uses: poli0981/.github/.github/workflows/notify-deploy.yml@main
    secrets: inherit
