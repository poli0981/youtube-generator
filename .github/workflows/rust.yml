name: Rust

# The Tauri shell changes rarely, so this only runs when it does (or weekly,
# to catch new RustSec advisories). Not a required check for that reason.
on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      # Pinned to a commit on master, with the toolchain passed explicitly: the
      # action's `stable` branch is regenerated from master, which orphans any
      # SHA pinned there (zizmor: impostor-commit). Master keeps its history.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # tauri::generate_context!() embeds the frontend at compile time, so
      # clippy and the tests need a built dist/.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        working-directory: src-tauri
        run: cargo test --locked

  # RustSec advisories, license allowlist, duplicate/banned crates and
  # registry sources for the whole crate tree (src-tauri/deny.toml).
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses sources
