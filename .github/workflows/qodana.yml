name: Qodana

# JetBrains Qodana static analysis, one linter per Qodana Cloud project:
#
#   typescript - qodana-js    (native mode)  the repository  project yt-ts-js, secret QODANA_TOKEN_TS_JS, qodana.yaml
#   rust       - qodana-rust  (Docker, EAP)  src-tauri/      project yt-rust,  secret QODANA_TOKEN_RUST, src-tauri/qodana.yaml
#
# Every run analyses the whole project (`pr-mode: false`), so a pull request
# and `main` report the same way, and each qodana.yaml holds a quality gate of
# zero problems. Results: Qodana Cloud, check annotations on the run, and the
# qodana-report-* artifacts (SARIF and logs). Not a required check.
#
# Both linters need an Ultimate licence; the account runs the Qodana Ultimate
# trial. When the licence lapses, both jobs fail at the licence check: renew
# it, or delete this file and the two qodana.yaml files.
#
# PRs from forks and from Dependabot get no repository secrets: the `tokens`
# job sees that, and the analysis is skipped there, not failed — main is
# analysed once they merge. The token reaches the scan step only: npm
# packages are installed in a step that never sees it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tokens:
    name: Qodana tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ts-js: ${{ steps.check.outputs.ts-js }}
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - name: Check which Qodana tokens this run has
        id: check
        env:
          HAS_TS_JS: ${{ secrets.QODANA_TOKEN_TS_JS != '' }}
          HAS_RUST: ${{ secrets.QODANA_TOKEN_RUST != '' }}
        run: |
          echo "ts-js=$HAS_TS_JS" >> "$GITHUB_OUTPUT"
          echo "rust=$HAS_RUST" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TS_JS" != true ] || [ "$HAS_RUST" != true ]; then
            echo "::notice::No Qodana token in this run (a Dependabot or fork pull request): that analysis is skipped."
          fi

  typescript:
    name: TypeScript / JavaScript
    needs: tokens
    if: needs.tokens.outputs.ts-js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write # the action's annotations
    steps:
      # The pull request's own head commit, not the merge GitHub makes, so
      # the report names a commit that exists; full history for its VCS data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # The linter resolves imports and types from node_modules. No lifecycle
      # scripts, as in every workflow (ci.yml says why).
      - run: npm ci --ignore-scripts
      # Native mode: the linter runs on this runner's Node 26 and node_modules
      # instead of the older Node the Qodana image ships.
      - name: Qodana scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --linter qodana-js --within-docker false
          pr-mode: false
          post-pr-comment: false
          upload-result: true
          artifact-name: qodana-report-typescript
          primary-cache-key: qodana-2026.2-js-${{ github.ref }}-${{ github.sha }}
          # A prefix, so pull requests can restore the cache saved on main.
          additional-cache-key: qodana-2026.2-js-
          cache-default-branch-only: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_TS_JS }}

  rust:
    name: Rust (Early Access)
    needs: tokens
    if: needs.tokens.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write # the action's annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # tauri::generate_context!() refuses to expand without the frontend
      # directory (frontendDist, ../dist): an empty page stands in for the web
      # build, which the analysis does not need. The icons are committed.
      - name: Stand-in for the web build
        run: |
          mkdir -p dist
          echo '<!doctype html><title>stand-in</title>' > dist/index.html
      # qodana-rust ships only as a Docker image. It runs as root so that the
      # bootstrap in src-tauri/qodana.yaml can install the C toolchain and the
      # libraries Tauri links against — without them `cargo check` fails and
      # the linter loads no Cargo package. The crates go to the cached Qodana
      # directory. --repository-root keeps ../dist and the git data visible.
      - name: Qodana scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --project-dir src-tauri --repository-root . --linter qodana-rust -u root -e CARGO_HOME=/data/cache/cargo
          pr-mode: false
          post-pr-comment: false
          upload-result: true
          artifact-name: qodana-report-rust
          primary-cache-key: qodana-2026.2-rust-${{ github.ref }}-${{ github.sha }}
          # A prefix, so pull requests can restore the cache saved on main.
          additional-cache-key: qodana-2026.2-rust-
          cache-default-branch-only: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_RUST }}
