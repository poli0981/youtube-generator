name: Release Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.29.0). The manifests must already carry this version."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android NDK (r27 LTS)
        run: sdkmanager "ndk;27.3.13750724"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write keystore.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Build signed APK
        env:
          # Pin NDK_HOME to the exact version we installed above — the runner may
          # ship a different default NDK that ANDROID_NDK_ROOT would point at.
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: cargo tauri android build --apk

      # Keep the APK regardless of whether the release upload works, so a
      # broken upload never costs a 20-minute rebuild.
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ytdescgen-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error

      # Uses `gh` (pre-installed on every runner) rather than a third-party
      # action. `softprops/action-gh-release@v3` resolved the target release
      # from GITHUB_REF instead of the `tag_name` it was given, so on a tag push
      # it looked for a release tagged `refs/tags/v0.35.0` and on a
      # workflow_dispatch it looked for one tagged `refs/heads/main` — neither
      # exists, so it tried to CREATE a release on a branch ref and got
      # "Resource not accessible by integration". The v0.35.0 APK was built
      # three times before this was pinned down.
      #
      # `gh release upload` takes the tag as a positional argument and cannot
      # make that mistake. `--clobber` makes a re-run idempotent.
      - name: Upload APK to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          APK: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
        run: |
          gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
