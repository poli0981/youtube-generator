name: Announce Release to Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-announce"
        required: true
        type: string

permissions:
  contents: read

jobs:
  link-discussion:
    runs-on: ubuntu-latest
    # `contents: write` edits the release; `discussions: write` lets GitHub
    # auto-create the linked Discussion under the configured category.
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Link release to Announcements discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated into the script: a tag name is
          # user-controlled text.
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        # Setting --discussion-category on a published release causes
        # GitHub to auto-create the linked Discussion. Requires the
        # repo to have Discussions enabled with an "Announcements"
        # category (configured manually under repo Settings).
        run: |
          gh release edit "$TAG" --repo "$REPO" --discussion-category "Announcements"

  announce:
    needs: link-discussion
    permissions:
      contents: read
    uses: poli0981/.github/.github/workflows/announce-release.yml@main
    with:
      tag_override: ${{ inputs.tag || '' }}
    # Only what the shared workflow declares — not `inherit`, which would hand
    # every repository secret (Android signing keys included) to it.
    secrets:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
      DISCORD_REPO_WEBHOOK: ${{ secrets.DISCORD_REPO_WEBHOOK }}
      DISCORD_PING_ROLE_ID: ${{ secrets.DISCORD_PING_ROLE_ID }}
