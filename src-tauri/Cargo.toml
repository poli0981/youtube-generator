[package]
name = "yt-desc-gen"
version = "0.29.3"
description = "YouTube Gameplay Description Generator"
authors = ["poli0981"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "yt_desc_gen_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

# Desktop-only: single-instance is unsupported on mobile and must not be
# compiled into the Android/iOS library. cfg(not(any(android, ios))) is the
# canonical Tauri "desktop" target table.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
