# Qodana for Rust (Early Access): the Tauri 2 shell of the desktop and
# Android apps. Run by .github/workflows/qodana.yml (job `rust`, Docker),
# reported to the Qodana Cloud project yt-rust (secret QODANA_TOKEN_RUST).
version: "1.0"
linter: qodana-rust
profile:
  name: qodana.recommended
# The quality gate: any problem fails the job.
failureConditions:
  severityThresholds:
    any: 0
# The linter evaluates build scripts and expands macros with `cargo check`,
# and its image has neither a C toolchain nor the libraries Tauri links
# against (the same packages rust.yml installs). Needs root in the container:
# the workflow passes `-u root`.
bootstrap: |
  apt-get update -qq
  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
exclude:
  - name: All
    paths:
      # Cargo's build output, and the Android project `tauri android init`
      # generated (Kotlin and Gradle, not Rust).
      - target
      - gen
  # tauri::generate_handler! needs each command's module path
  # (`storage::backup_list`): the #[tauri::command] macro puts a hidden
  # helper next to the function, and the handler finds it through that
  # path. Without the prefix the crate no longer compiles.
  - name: RsUnnecessaryQualifications
    paths:
      - src/lib.rs
