# cargo-deny configuration for the Tauri shell. Run by
# .github/workflows/rust.yml (on changes under src-tauri/, and weekly for new
# RustSec advisories): `cargo deny check advisories licenses sources`.

[graph]
all-features = false

[advisories]
# Unmaintained crates only fail the check when this crate depends on them
# directly. The transitive ones today (e.g. proc-macro-error, RUSTSEC-2024-0370,
# via tauri's gtk-rs 0.18 Linux stack) have no safe upgrade until tauri moves
# on, and would otherwise keep this job permanently red. Vulnerabilities
# always fail, whatever the depth.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
# Permissive licenses, plus MPL-2.0 (file-level copyleft; used unmodified).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
