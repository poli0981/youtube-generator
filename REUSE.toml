# REUSE (https://reuse.software) licensing information for the whole
# repository, checked in CI by .github/workflows/compliance.yml.
#
# Everything here is original work released under Apache-2.0 unless a more
# specific annotation below says otherwise. Add one whenever a file under
# another license lands (a font, a vendored icon set, …) — CI fails until it
# is declared.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 poli0981 (SkullMute) and YTDescGen contributors"
SPDX-License-Identifier = "Apache-2.0"

# The Gradle wrapper that Tauri's Android template commits is Gradle's own
# code, not the project's: its headers read "Copyright 2015 the original
# author or authors" under Apache-2.0.
[[annotations]]
path = [
  "src-tauri/gen/android/gradlew",
  "src-tauri/gen/android/gradlew.bat",
  "src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar",
]
precedence = "override"
SPDX-FileCopyrightText = "2015 the original author or authors"
SPDX-License-Identifier = "Apache-2.0"
