# SonarCloud, CI-based analysis. Automatic Analysis is off in the project's
# settings: the scanner runs in the `sonarcloud` job of
# .github/workflows/ci.yml, on every PR and every push to main, and reads this
# file. The version (package.json) is passed on the command line there.
sonar.organization=poli0981
sonar.projectKey=poli0981_youtube-generator
sonar.sourceEncoding=UTF-8

# Main code is the whole repository: the app, the Worker, the build plugins,
# the scripts, the Tauri shell (Rust, and the Android project, which is
# committed and edited), the migration page and the workflows. The tests are
# analysed as tests: the same files Vitest runs (vitest.config.ts) plus
# tests/helpers. Files git ignores are left out on their own; binary files
# (the icons, the Gradle wrapper's jar) are left out here — there is nothing
# in them to analyse, and the scanner warns about each one it reads as text.
sonar.sources=.
sonar.exclusions=tests/**,src/**/*.test.ts,src/**/*.test.tsx,**/*.png,**/*.ico,**/*.icns,**/*.jar
sonar.tests=.
sonar.test.inclusions=tests/**,src/**/*.test.ts,src/**/*.test.tsx

# Coverage is Vitest's LCOV report (`npm run test:coverage` in the `check`
# job), which measures the logic layers: src/engine, src/config, src/store,
# src/utils, worker/ and build-plugins/. SonarCloud would count a file missing
# from the report as 0 % covered, so everything else is excluded here. Keep
# this list in step with `coverage.include` in vitest.config.ts.
#   - No test renders a component or page (there is no DOM environment); the
#     hooks and i18n are React and i18next glue, checked in the running app.
#   - worker/index.ts only wires the router to the Workers runtime.
#   - scripts/ and the config files are tooling; the migration page and
#     public/theme-init.js are static pages' scripts.
#   - The Rust and Android code have no coverage tooling.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/App.tsx,\
  src/main.tsx,\
  src/components/**,\
  src/pages/**,\
  src/hooks/**,\
  src/i18n/**,\
  worker/index.ts,\
  scripts/**,\
  *.config.js,\
  *.config.ts,\
  migration-page/**,\
  public/**,\
  src-tauri/**

# The scan waits for the quality gate and fails the job when it fails, so the
# result is in CI as well as in SonarCloud's own check on the PR.
sonar.qualitygate.wait=true
